services:
  icloud_distribution:
    build: .
    container_name: icloud_distribution
    ports:
      - "6981:6981"
    environment:
      - HME_SUPERADMIN_USERNAME=${HME_SUPERADMIN_USERNAME:?请设置 HME_SUPERADMIN_USERNAME}
      - HME_SUPERADMIN_PASSWORD=${HME_SUPERADMIN_PASSWORD:?请设置 HME_SUPERADMIN_PASSWORD}
    volumes:
      # accounts.json / shares.json 持久化到宿主机 ./data
      - ./data:/app/data
    restart: unless-stopped
  icloud_mcp:
    build:
      context: .
      dockerfile: mcp/Dockerfile
    container_name: icloud_mcp
    ports:
      - "127.0.0.1:8787:8787"
    depends_on:
      - icloud_distribution
    restart: unless-stopped
